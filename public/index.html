  <!-- 웹폰트 (Pretendard, Inter): 렌더 블로킹 방지를 위해 비동기 로드 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css"
    media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    media="print" onload="this.media='all'">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  </noscript>

  <!-- 경로별 LCP 리소스 Preload
       - 홈: 메인 배너 이미지 (데스크탑 1200px 초과 / 모바일)
       - 상품 목록: 상품 데이터(shop.json)를 JS 번들 로드와 병렬로 요청 -->
  <script>
    (function () {
      var path = location.pathname;
      function preload(href, as, media) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = as;
        link.href = href;
        if (media) link.media = media;
        if (as === 'fetch') link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      }
      if (path === '/') {
        preload('https://res.cloudinary.com/daqjqq0hy/image/upload/w_1920,f_auto,q_auto/v1705893944/wmzeuycnkxyldfnqllyz.webp', 'image', '(min-width: 1201px)');
        preload('https://res.cloudinary.com/daqjqq0hy/image/upload/w_800,f_auto,q_auto/v1705894339/s3apdxiz3mrpz10rnagw.webp', 'image', '(max-width: 1200px)');
      } else if (path.indexOf('/shop') === 0 && '%REACT_APP_FIREBASE_DB_URL%') {
        preload('%REACT_APP_FIREBASE_DB_URL%/shop.json', 'fetch');
      }
    })();
  </script>

  <title>SHOPPY</title>
